services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickethub}
      POSTGRES_DB: ${POSTGRES_DB:-tickethub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tickethub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickethub} -d ${POSTGRES_DB:-tickethub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tickethub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tickethub-postgres:
  tickethub-redis:

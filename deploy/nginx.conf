# Serves the single page app and proxies /api to the API container. TLS is expected to end in front of this container
# (a load balancer or a reverse proxy such as Caddy/Traefik); it must send X-Forwarded-Proto and X-Forwarded-For.

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 256k;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Same origin for the page and the API: cookies stay SameSite and no CORS is needed.

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The payment webhook needs the exact request body; never buffer-modify or rate limit it below the API's own limit.
  location = /api/webhooks/geniuspay {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 30s;
  }

  location ~ ^/api/auth/(login|register) {
    limit_req zone=api_auth burst=10 nodelay;
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /api/ {
    limit_req zone=api_general burst=60 nodelay;
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 30s;
  }

  # Hashed build output never changes: cache it for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # These must always be revalidated so a new release and its service worker are picked up.
  location ~* ^/(index\.html|sw\.js|workbox-.*\.js|manifest\.webmanifest|robots\.txt|sitemap\.xml)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Single page app: unknown paths get the shell, which shows its own 404 page.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # When the API container is down, show a branded page instead of a bare gateway error.
  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html-errors;
    include /etc/nginx/snippets/security-headers.conf;
    internal;
  }
}
